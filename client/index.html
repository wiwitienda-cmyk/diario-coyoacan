<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Base -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Search Engine Verification -->
    <meta name="msvalidate.01" content="0B3EF4FE81525EF8AB8B5EEA0EA24C5B" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!--
      Script de limpieza: elimina los meta tags que la plataforma inyecta
      estáticamente (og:*, twitter:*, canonical, description) ANTES de que
      React monte, para que react-helmet-async los inyecte correctamente
      sin duplicados. Esto resuelve los errores de Bing Webmaster Tools.
    -->
    <script>
      (function() {
        var head = document.head;
        // Eliminar og:* y twitter:* inyectados por la plataforma
        var metasToRemove = head.querySelectorAll(
          'meta[property^="og:"], meta[name^="twitter:"], meta[name="description"]'
        );
        metasToRemove.forEach(function(el) { el.parentNode.removeChild(el); });
        // Eliminar canonical inyectado por la plataforma
        var canonicals = head.querySelectorAll('link[rel="canonical"]');
        canonicals.forEach(function(el) { el.parentNode.removeChild(el); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
