<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Base -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#1a1008" />
    
    <!-- Search Engine Verification -->
    <meta name="msvalidate.01" content="0B3EF4FE81525EF8AB8B5EEA0EA24C5B" />
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VSZ9P3M8P5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VSZ9P3M8P5', {
        send_page_view: true
      });
    </script>

    <!-- Preconnect crítico para performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts: solo las fuentes críticas para el periódico -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Oswald:wght@400;600&family=UnifrakturMaguntia&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />

    <!--
      Script de limpieza: elimina los meta tags que la plataforma inyecta
      estáticamente (og:*, twitter:*, canonical, description) ANTES de que
      React monte, para que react-helmet-async los inyecte correctamente
      sin duplicados. Esto resuelve los errores de Bing Webmaster Tools.
    -->
    <script>
      (function() {
        var head = document.head;
        var metasToRemove = head.querySelectorAll(
          'meta[property^="og:"], meta[name^="twitter:"], meta[name="description"]'
        );
        metasToRemove.forEach(function(el) { el.parentNode.removeChild(el); });
        var canonicals = head.querySelectorAll('link[rel="canonical"]');
        canonicals.forEach(function(el) { el.parentNode.removeChild(el); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
